<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `interactive-widget=resizes-content` asks the browser to take the
         on-screen keyboard's height out of the layout viewport, so a shell laid
         out to the window's height shrinks instead of being covered. The app is
         one non-scrolling screen with its own scrollers inside, so there is
         nothing for the default (`resizes-visual`, which slides a viewport the
         page can't see) to reveal. Not honoured by every browser — see
         `appHeight` in App.svelte for the half that covers the rest. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <!-- Replaced by App.svelte with something that names the plotted series;
         this is only what shows before the app mounts. -->
    <title>Perfherder Graphs</title>
    <!-- Resolve the theme before the first paint, or a dark-mode user gets a
         white flash for as long as it takes the module graph to load. This
         deliberately duplicates the storage key and the resolution rule from
         src/lib/shared/theme.ts — a module import can't run early enough, and the two
         copies are three lines. Keep them in step. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('perfherder2:theme');
        } catch (e) {
          /* storage blocked; follow the OS */
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
