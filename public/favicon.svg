<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Perfherder's own favicon (treeherder ui/img/line_chart.png) is a black
    L-axis with a zigzag arrow. This keeps the axis and the rising zigzag and
    replaces the arrowhead with the dots the app actually plots. The arrowhead
    is the loaded part: it claims "better", and for performance data a line
    going up is as often a regression — the same reason the details pane
    reserves the improvement verdict for one series over time. The colors
    mirror the app's own: the accent-fg token for the first point, cerulean and
    orange from SERIES_COLORS for the rest, fg-subtle for the axis. That grey
    reads on a light and a dark tab strip alike, so the icon needs no theme of
    its own. (Token names are written without their leading dashes because an
    XML comment may not contain a double hyphen.)

    Authored on a 16-unit grid, because 16px is what a tab strip renders. Two
    rules follow from that, and both break silently if a coordinate is nudged:

      * The axis sits on half-integers with a 1-unit stroke, so it covers
        exactly one pixel column and one row rather than straddling two and
        rendering as a grey smear. `crispEdges` holds that if a renderer
        rounds differently.
      * Every dot centre is on a half-integer — a pixel centre — so each dot
        has one fully opaque pixel in the middle instead of a four-pixel
        smudge. Check with `rsvg-convert -w 16` and an alpha dump, not by eye.
  -->
  <path d="M2.5 1.5V13.5H14.5" fill="none" stroke="#8c959f" stroke-width="1" shape-rendering="crispEdges"/>
  <path d="M5.5 10.5 7.5 6.5 10.5 8.5 13.5 3.5" fill="none" stroke="#16BCDE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
  <circle cx="5.5" cy="10.5" r="1.6" fill="#0969da"/>
  <circle cx="7.5" cy="6.5" r="1.6" fill="#16BCDE"/>
  <circle cx="10.5" cy="8.5" r="1.6" fill="#16BCDE"/>
  <circle cx="13.5" cy="3.5" r="1.8" fill="#FFB851"/>
</svg>
