name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Vite 8 needs Node 20.19+ / 22.12+; 24 is what this is developed on.
          node-version: 24
          cache: npm
      - run: npm ci
      # The gates CLAUDE.md asks for before every commit, in the order that
      # fails fastest on the most likely mistake. `check` covers the CLI too
      # (tsconfig.cli.json); `build:cli` is here because a bundle can break in
      # ways a type check can't see — an unexternalized node builtin, say — and
      # it costs 21 ms.
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      # What `prepublishOnly` runs. Here too, because the things it checks — the
      # shebang, the executable bit, the version compiled into the bundle — are
      # properties of the build config, and finding them broken at publish time
      # means finding them broken in a hurry.
      - run: npm run verify:cli
